<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arara Wave</title>
    <link rel="shortcut icon" href="/img/icones/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/carrinho.css">

    <script type="module" src="/js/telaCarrinho.js" defer></script>
</head>
<body>
    <main id="geral">
        <header id="cabecalho">
            <div id="logo">
                <a href="/index.html">
                    <img src="/img/icones/pngAraraRemovido.png" alt="logo">
                </a>
            </div>
            <nav id="menu">
                <ul>
                    <li>
                        <a href="/index.html" class="linkMenu">HOME</a></li>
                    <li>
                        <a href="/paginas/cadastro.html" class="linkMenu">CADASTRO</a>
                    </li>
                    <li>
                        <a href="/paginas/sobre.html" class="linkMenu">SOBRE</a>
                    </li>
                </ul>
            </nav>

            <div id="divIcons">
                <ul>
                    <li>
                        <a href="/paginas/cadastro.html" class="linkIncon"> 
                            <img src="/img/icones/login.png" alt="" width="20px">
                        </a>
                    </li>
                    <li>
                        <a href="/paginas/carrinho.html" class="linkIncon">
                            <img src="/img/icones/carrinho.png" alt="" width="20px">
                        </a>
                    </li>
                </ul>
            </div>
            <!--<h1>ARARA WAVE</h1>-->              
        </header>

        <nav id="nav-secoes">
            <ul id="menu-secoes">
                <li><a href="#" class="lnk-secao">Todos</a></li>
                <li><a href="#" class="lnk-secao">FishBoard</a></li>
                <li><a href="#" class="lnk-secao">LongBoard</a></li>
                <li><a href="#" class="lnk-secao">ShortBoard</a></li>
            </ul>
        </nav>

        <section id="secGeral">
            <section id="navCompras">
    
                <section class="cardCompras">
                    <img src="/img/fish/fish05.jpg" alt="Prancha Fish 05" class="img-item">
                    <p class="descricao">Prancha Fish 05</p>
                    <p class="vlr-unitario">R$ 2000,00</p>
                    <input type="number" name="quant1" id="quant1" class="input-item" value="1">
                    <p class="tot-item">R$ 2000,00</p>
                    <img src="/img/icones/remover.png" alt="img-remover" class="img-remover">
                </section>
    
            </section>

            <section id="pagamento">
                <div id="divResumoPag">
                    <h2>Resumo do Pedido</h2>
                    <h5>Calcular Frete</h5>
                    <input type="text" placeholder="Digite seu CEP">
                    <button type="submit" id="cepBtn"
                    >Calcular</button>
                    <h5>Frete</h5> 
                    <input type="text">
                    <hr>
                    <h5>Itens (3)</h5>
                    <input type="number">
                    <h5>Frete</h5>
                    <input type="number">
                    <H5>Desconto</H5>
                    <input type="number">
                    <hr>
                    <h5>Total a pagar</h5>
                    <input type="text">

                    <button id="btnFinalizarCompra">FINALIZAR COMPRA</button>
                </div>
            </section>

        </section>
        

        <!--FOOTER-->
        <footer id="rodape">
            <div id="dadoLoja">
                <h2>Rua Maria Fernandinha, 1201 - Atalaia</h2>
                <h1>Aracaju - Sergipe</h1>
            </div>

            <div id="iconSociais">
                <ul>
                    <li>
                        <a href="https://www.instagram/araraWave">
                            <img src="/img/icones/instagram.png" alt="instagram">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.facebook.com/araraWave">
                            <img src="/img/icones/facebook.png" alt="">
                        </a>
                    </li>
                </ul>
            </div>
            <div id="cartao">
                <img src="/img/icones/pix.png" alt="Pix">
                <img src="/img/icones/visa.png" alt="Visa">
                <img src="/img/icones/mastercard.png" alt="Mastercard">
                <img src="/img/icones/hipercard.png" alt="Hipercard">
            </div>
        </footer>
    </main>
</body>
</html>
