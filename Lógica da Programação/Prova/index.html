<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta Resíduos</title>
    <style>
        h1{text-align: center;}
        input{border-radius: 4px;}
        button{border-radius: 4px; border: none;}
        button:hover{ background-color: rgb(157, 180, 255);}
        #resultado{margin-top: 10px;}
        #formColeta{text-align: center;}
    </style>
</head>
<body>
    <div id="coletaGeral">
        <h1>Coleta de Resíduos</h1>
            <form id="formColeta">
                <label for="descricao">Descrição da empresa</label>
                <input type="text" name="descricao" id="descricao">

                <label for="">Quantidade de resíduos</label>
                <input type="number" name="quantidade" id="quantidade">

                <button type="submit">Verificar</button>
            </form>
        
    </div>
    <div id="resultado"></div>

    <script type="module" src="/js/scriptColeta.js"></script>
</body>
</html>
