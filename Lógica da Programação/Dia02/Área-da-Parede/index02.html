<!DOCTYPE html>
<html lang="en">
<head>

    <title>Questão 2</title>

<body>
    
    <div id="geral">
        <h3>Calculando a área da parede</h3>
        <form id="formulario">
            <label for="largura">Informe a largura da parede</label>
            <input type="number" name="largura" id="valorLargura">

            <label for="altura">Informe a altura da parede</label>
            <input type="number" name="altura" id="valorAltura">

            <button type="submit">Calcular</button>
            <button type="reset">Limpar</button>
        </form>

        <div id="resultado"></div>
    </div>
    <script src="../questao02/script02.js" defer></script>
</body>
