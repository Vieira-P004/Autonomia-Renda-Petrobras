<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 03</title>
    <link rel="stylesheet" href="../questao03/style03.css">
</head>
<body>
    <div id="geral">
        <h3>Quanto você vai gastar?</h3>
        <form id="formulario">
            <label for="distância">Informe a distância que vai ser percorrida (em quilometros)</label>
            <input type="number" name="num1" id="num1">

            <label for="consumo">Informe o consumo médio do veículo (em km/L)</label>
            <input type="number" name="num2" id="num2">

            <label for="preco">O preço do litro do combustivel</label>
            <input type="number" name="num3" id="num3">

            <button type="submit">Calcular</button>
            <button type="reset">Limpar</button>
        </form>
        <div id="resultado"></div>
    </div>

    
    
    <script src="../questao03/script03.js"></script>
</body>
</html>
