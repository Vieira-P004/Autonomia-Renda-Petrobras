<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    
</head>
<body>
    <h1>Cadastro</h1>
    <form action="">
        <label for="nome">Nome</label> <!-- TEXTO QUE IDENTIFICA O CAMPO-->
        <input type="text" id="nome" name="nome" required> <!--ENTRADA DE INFORMAÇÕES-->
        <br><br>

         <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required> <!--REQUIRED = CAMPO OBRIGATÓRIO-->
        <br><br>

         <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade">
        <br><br>

        <button type="submit">Enviar</button> <!--"TYPE = SUBMIT"  ENVIAR FORMULÁRIO-->
    </form>

    <script src="script.js"></script>
</body>
</html>
