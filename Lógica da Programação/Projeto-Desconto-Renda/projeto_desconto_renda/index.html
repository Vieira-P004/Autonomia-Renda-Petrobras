<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="geral">
        <h3>Desconto nas renda</h3>

        <p>São isento as pessoas menor de idade e com renda até R$1700,0</p>
        <p>Até 5000 - > desconto de 5%</p>
        <p>De 5001,00 até 8000,00 -> 8%</p>
        <p>De 8001,00 até 10000,00 -> 10%</p>
        <p>De 10001,00 em dia -> 10%</p>

        
        <div id="div-form">
        <form id="formPessoa">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome">

            <label for="idade">Idade</label>
            <input type="text" name="idade" id="idade">

            <label for="renda">Renda</label>
            <input type="text" name="renda" id="renda">

            <button type="submit">Adicionar</button>
            <button type="reset">Limpar</button>
        </form>
        </div>

        <div id="div-lista-pessoas">
            
        </div>
      


    </div>
    <script src="/js/script_pessoas.js"></script>
</body>
</html>
