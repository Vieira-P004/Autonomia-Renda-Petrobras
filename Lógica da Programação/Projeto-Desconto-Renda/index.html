<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo Seguro e IPVA </title>
    <link rel="stylesheet" href="./css/style_veiculo.css">
</head>
<body>
    <div id="geral">
        <h1>Cadastro de Veículo</h1>
    <form id="formulario">
        <label for="">Placa</label>
        <input type="text" name="placa" id="placa" placeholder="Informe a placa do veículo">

        <label for="">Modelo</label>
        <input type="text" name="modelo" id="modelo" placeholder="Informe o modelo do veículo">

        
        <label for="">Marca</label>
        <input type="text" name="marca" id="marca" placeholder="Informe o marca do veículo">
        
        <label for="">Ano</label>
        <input type="number" name="ano" id="ano" placeholder="Informe o ano do veículo">
        
        <label for="">Valor de Mercado</label>
        <input type="text" name="mercado" id="mercado" placeholder="Informe o valor de mercado">

        <h3>Tipo de Combustível</h3>
        
        <label><input type="radio" name="combustivel" value="gasolina" checked><span>Gasolina</span></label>
        <label for="">Etanol</label>
        <input type="radio" name="combustivel" value="etanol">

        <label for="">Bio Combustível</label>
        <input type="radio" name="combustivel" value="biocombustivel">

        <label for="">Híbrido</label>
        <input type="radio" name="combustivel" value="hibrido">

        <label for="">Elétrico</label>
        <input type="radio" name="combustivel" value="eletrico">

        <button type="submit">Enviar cadastro</button>
    </form>

    <div id="resultado"></div>
    </div>

    <script src="/js/script_calculo.js"></script>
    <script src="/js/script_veiculo.js"></script>
</body>
</html>
